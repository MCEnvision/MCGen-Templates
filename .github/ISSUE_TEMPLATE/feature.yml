name: feature request
description: propose a focused improvement
title: "[feature] "
labels: ["type feature", "status backlog"]
type: Feature
body:
  - type: markdown
    attributes:
      value: |
        this repository owns template pack contracts, sources, catalogs, profiles, template families, fixtures, verification, releases, and repository controls. website, api, user facing project generator cli, generator application, github app, nginx, cloudflare, and production requests belong in the future mcgen application repository.
  - type: dropdown
    id: area
    attributes:
      label: affected area
      options:
        - descriptor or schema
        - compatibility catalog
        - catalog generation
        - source adapter
        - toolchain profile
        - template family
        - customization contract
        - fixture generation or generated build
        - verification
        - release or repository operation
        - github repository governance or automation
        - documentation
        - other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: problem
      description: explain the user or maintainer problem this should solve
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: proposed behavior
      description: describe the observable behavior and important edge cases
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: alternatives considered
  - type: textarea
    id: related
    attributes:
      label: related work and dependencies
      description: link related issues, pull requests, milestones, source evidence, or work that blocks or is blocked by this request
  - type: textarea
    id: compatibility
    attributes:
      label: compatibility and provenance
      description: identify affected platforms, versions, authoritative sources, licensing constraints, and migration requirements
  - type: textarea
    id: risks
    attributes:
      label: risks and failure behavior
      description: describe security, reproducibility, performance, outage, fallback, and rollback concerns
  - type: textarea
    id: acceptance
    attributes:
      label: acceptance criteria
      description: list concrete outcomes that prove the request is complete
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: checks
      options:
        - label: i searched for an existing issue
          required: true
        - label: this request does not depend on a branch for every version
          required: true
        - label: this request belongs to the mcgen templates repository
          required: true
