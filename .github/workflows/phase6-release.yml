name: phase 6 immutable release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      tag:
        description: existing signed semantic version tag
        required: true
        type: string

concurrency:
  group: phase6-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build and verify release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: checkout first clean copy
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          path: checkout-a

      - name: checkout second clean copy
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          path: checkout-b

      - name: setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: checkout-a/package-lock.json

      - name: install first copy
        working-directory: checkout-a
        run: npm ci

      - name: install second copy
        working-directory: checkout-b
        run: npm ci

      - name: verify first clean copy
        working-directory: checkout-a
        run: npm run verify

      - name: verify second clean copy
        working-directory: checkout-b
        run: npm run verify

      - name: build first candidate
        working-directory: checkout-a
        env:
          PACK_VERSION: ${{ inputs.tag || github.ref_name }}
        run: |
          node scripts/create-pack-input.mjs --pack-version "${PACK_VERSION#v}"
          npm run phase6:pack -- --input verification/phase6/release-input.json --output-dir verification/phase6/release-output
          node scripts/verify-pack-offline.mjs --dir verification/phase6/release-output
          node scripts/test-release-rollback.mjs --dir verification/phase6/release-output > verification/phase6/release-output/rollback-test.json

      - name: build second candidate
        working-directory: checkout-b
        env:
          PACK_VERSION: ${{ inputs.tag || github.ref_name }}
        run: |
          node scripts/create-pack-input.mjs --pack-version "${PACK_VERSION#v}"
          npm run phase6:pack -- --input verification/phase6/release-input.json --output-dir verification/phase6/release-output
          node scripts/verify-pack-offline.mjs --dir verification/phase6/release-output
          node scripts/test-release-rollback.mjs --dir verification/phase6/release-output > verification/phase6/release-output/rollback-test.json

      - name: compare clean checkout outputs
        run: |
          cmp checkout-a/verification/phase6/release-output/mcgen-template-pack.zip checkout-b/verification/phase6/release-output/mcgen-template-pack.zip
          cmp checkout-a/verification/phase6/release-output/mcgen-template-pack.zip.sha256 checkout-b/verification/phase6/release-output/mcgen-template-pack.zip.sha256
          cmp checkout-a/verification/phase6/release-output/mcgen-template-pack.zip.sha512 checkout-b/verification/phase6/release-output/mcgen-template-pack.zip.sha512
          cmp checkout-a/verification/phase6/release-output/pack-manifest.json checkout-b/verification/phase6/release-output/pack-manifest.json
          cmp checkout-a/verification/phase6/release-output/source-commit-manifest.json checkout-b/verification/phase6/release-output/source-commit-manifest.json
          cmp checkout-a/verification/phase6/release-output/spdx-sbom.json checkout-b/verification/phase6/release-output/spdx-sbom.json
          cmp checkout-a/verification/phase6/release-output/verification-summary.json checkout-b/verification/phase6/release-output/verification-summary.json

      - name: stage release assets
        run: |
          mkdir release-assets
          cp checkout-a/verification/phase6/release-output/mcgen-template-pack.zip release-assets/
          cp checkout-a/verification/phase6/release-output/mcgen-template-pack.zip.sha256 release-assets/
          cp checkout-a/verification/phase6/release-output/mcgen-template-pack.zip.sha512 release-assets/
          cp checkout-a/verification/phase6/release-output/pack-manifest.json release-assets/
          cp checkout-a/verification/phase6/release-output/source-commit-manifest.json release-assets/
          cp checkout-a/verification/phase6/release-output/spdx-sbom.json release-assets/
          cp checkout-a/verification/phase6/release-output/verification-summary.json release-assets/
          cp checkout-a/verification/phase6/release-output/rollback-test.json release-assets/
          cp checkout-a/verification/phase5/coverage.json release-assets/coverage.json
          cat > release-assets/release-notes.md <<'EOF'
          this release contains deterministic template pack content, source provenance, checksums, sbom, coverage, and offline verification evidence.

          supported and verified boundaries are listed in the bundled coverage and verification records. discovered and blocked values remain explicit.
          EOF

      - name: upload release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase6-release-candidate-${{ github.run_id }}
          path: release-assets
          if-no-files-found: error
          retention-days: 3

  publish:
    name: publish and verify immutable release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: checkout exact tagged commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.13.0

      - name: download release candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: phase6-release-candidate-${{ github.run_id }}
          path: release-assets

      - name: validate signed annotated tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          test "$(git cat-file -t "refs/tags/${RELEASE_TAG}")" = tag
          tag_object=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq .object.sha)
          tag_type=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object}" --jq .object.type)
          tag_commit=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object}" --jq .object.sha)
          verified=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object}" --jq .verification.verified)
          test "${tag_type}" = commit
          test "${tag_commit}" = "${GITHUB_SHA}"
          test "${verified}" = true

      - name: attest pack archive
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2.2.3
        with:
          subject-path: release-assets/mcgen-template-pack.zip

      - name: create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release create "${RELEASE_TAG}" --draft --prerelease --title "mcgen template pack ${RELEASE_TAG#v}" --notes-file release-assets/release-notes.md --verify-tag

      - name: upload validated assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release upload "${RELEASE_TAG}" release-assets/* --clobber

      - name: verify downloaded assets offline
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          rm -rf remote-release
          mkdir remote-release
          gh release download "${RELEASE_TAG}" --dir remote-release --pattern 'mcgen-template-pack.zip' --pattern 'mcgen-template-pack.zip.sha256' --pattern 'mcgen-template-pack.zip.sha512' --pattern 'pack-manifest.json' --pattern 'source-commit-manifest.json' --pattern 'spdx-sbom.json' --pattern 'verification-summary.json'
          cp release-assets/coverage.json remote-release/coverage.json
          npm ci
          npm run build --silent
          node scripts/verify-pack-offline.mjs --dir remote-release
          gh attestation verify remote-release/mcgen-template-pack.zip --repo "${GITHUB_REPOSITORY}"

      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release edit "${RELEASE_TAG}" --draft=false --prerelease
