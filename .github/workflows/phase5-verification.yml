name: phase 5 tuple verification

on:
  pull_request:
    paths:
      - "profiles/**"
      - "templates/**"
      - "fixtures/**"
      - "catalog/**"
      - "schemas/**"
      - "src/**"
      - "tests/**"
      - "package-lock.json"
  push:
    branches:
      - main
    paths:
      - "profiles/**"
      - "templates/**"
      - "fixtures/**"
      - "catalog/**"
      - "schemas/**"
      - "src/**"
      - "tests/**"
      - "package-lock.json"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase5-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: phase 5 contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
      - name: setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.13.0"
          cache: npm
      - name: install
        run: npm ci
      - name: verify phase 5 contracts
        run: npm run verify
