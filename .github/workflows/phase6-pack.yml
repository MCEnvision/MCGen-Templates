name: phase 6 pack verification

on:
  pull_request:
    paths:
      - ".github/workflows/phase6-pack.yml"
      - "docs/release/**"
      - "schemas/**"
      - "src/**"
      - "tests/**"
      - "verification/phase6/pack-input.example.json"
      - "package.json"
      - "package-lock.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/phase6-pack.yml"
      - "docs/release/**"
      - "schemas/**"
      - "src/**"
      - "tests/**"
      - "verification/phase6/pack-input.example.json"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase6-pack-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pack:
    name: deterministic pack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      - name: setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
          cache: npm

      - name: install dependencies
        run: npm ci

      - name: run repository verification
        run: npm run verify

      - name: bind input to checked out commit
        run: |
          node --input-type=module -e 'import { readFile, writeFile } from "node:fs/promises"; import { execFileSync } from "node:child_process"; const input = JSON.parse(await readFile("verification/phase6/pack-input.example.json", "utf8")); input.sourceCommit = execFileSync("git", ["rev-parse", "HEAD"], { encoding: "utf8" }).trim(); await writeFile(`verification/phase6/ci-input-${process.env.GITHUB_RUN_ID}.json`, `${JSON.stringify(input, null, 2)}\n`);'

      - name: build and verify pack
        run: npm run phase6:pack -- --input verification/phase6/ci-input-${GITHUB_RUN_ID}.json --output-dir verification/phase6/ci-output-${GITHUB_RUN_ID}

      - name: upload pack evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase6-pack-${{ github.run_id }}
          path: verification/phase6/ci-output-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 7
